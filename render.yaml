services:
  - type: worker
    name: halal-momentum-bot
    runtime: python
    buildCommand: pip install --upgrade pip && pip install --backtrack-limit 100 -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_IS_PAPER
        value: "true"