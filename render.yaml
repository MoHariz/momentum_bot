services:
  - type: worker
    name: halal-momentum-bot
    runtime: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install "PyYAML==6.0.1" && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_IS_PAPER
        value: "true"